name: Run daily codegen and pull request action

# Daily check for upstream language-data changes.
# The hub task regenerates the data through this repository's own codegen hook and opens a pull request per branch only when it changed.
# The merge-bot auto-merges that pull request.
# On the main leg the changed data is a shipped input pushed by a bot, so the publisher then releases it.
# On the develop leg nothing publishes, since the publisher's push trigger is main-only and a develop prerelease is dispatch-only.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'

# GOVERNANCE.md "Workflow YAML Conventions" Concurrency exception (5).
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

# Every write in the called workflow uses the App token, so GITHUB_TOKEN gets no scope.
permissions: {}

jobs:

  run-codegen:
    name: Run codegen and pull request job
    uses: ptr727/ProjectTemplate/.github/workflows/run-codegen-pull-request-task.yml@245353323c7ee5617edfe82331d0e83b266bebb2 # 2.0.1366
    secrets:
      CODEGEN_APP_CLIENT_ID: ${{ secrets.CODEGEN_APP_CLIENT_ID }}
      CODEGEN_APP_PRIVATE_KEY: ${{ secrets.CODEGEN_APP_PRIVATE_KEY }}
