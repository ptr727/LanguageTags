name: Test pull request action

# CI for every pull request into main or develop, and for those two branches after a merge lands on them.
# The validate and smoke-build jobs are reusable tasks reached by pin, so their bodies are not here.
# The changes filter and the aggregator are this repository's own, and the aggregator's name is bound by the branch ruleset.
#
# The push trigger is main and develop only, and it exists because the required checks are not strict.
# A pull request that went green against an older base still merges, so nothing would otherwise ever validate the merge result.
# That case is routine here rather than theoretical, since Dependabot and the daily codegen pull requests auto-merge on their own checks.
# A feature branch matches no push entry, so a pull request still runs exactly once.
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# GITHUB_TOKEN gets no scope by default, and each job below grants only what it reads with.
permissions: {}

jobs:

  # This repository builds one release target, the NuGet package (D1.1).
  # The filter entries are the publisher's own shipped-input list, so the smoke gate and the publish gate agree on what affects the package by construction.
  # Naming the inputs rather than excluding workflow files means a documentation-only or workflow-only pull request skips the smoke build rather than packing the library for nothing (D1.4, and scenarios S2 and S3).
  changes:
    name: Detect changed targets job
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      release: ${{ steps.filter.outputs.release }}
    steps:
      # Full history, since a push or dispatch run has no pull request to query and the filter diffs locally instead.
      # A shallow checkout could leave it with no common ancestor to diff from.
      - name: Checkout code step
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Filter changed paths step
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            release:
              - 'LanguageTags/**'
              - 'LanguageData/**'
              - 'version.json'
              - 'Directory.Build.props'
              - 'Directory.Packages.props'

  validate:
    name: Validate job
    uses: ptr727/ProjectTemplate/.github/workflows/validate-task.yml@a9afa1d0f56e0160b65baf70ae64a9b6122e8405 # 2.0.539
    permissions:
      contents: read
    # Mapped explicitly rather than inherited, since this is a cross-repository call and secrets: inherit would hand the callee every secret this repository holds.
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Build and pack the library in its branch configuration to prove it ships, publishing and uploading nothing (D1.3).
  # Setting smoke true hard-disables every publish path in the release task regardless of the flags below it.
  #
  # A dispatch runs the smoke build unconditionally.
  # On that trigger the filter has no pull request to read and no distinct base to diff, so it reports only the tip commit's own paths.
  # Gating on that would make a dispatch answer about the last commit rather than about the tree, and a dispatch is the only way to smoke-build a change the filter deliberately excludes.
  smoke-build:
    name: Smoke build job
    needs: [changes]
    if: needs.changes.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
    uses: ptr727/ProjectTemplate/.github/workflows/build-release-task.yml@a9afa1d0f56e0160b65baf70ae64a9b6122e8405 # 2.0.539
    permissions:
      contents: read
    with:
      smoke: true
      github: false
      enable_nuget: true
      enable_docker: false
      enable_pypi: false
      enable_dotnet_publish: false
      nuget_project: ./LanguageTags/LanguageTags.csproj
      # On a pull_request event github.ref_name is the pull request ref, for example 123/merge, never the target branch.
      # The logical branch reads base_ref first and only falls back to ref_name on a push or dispatch.
      branch: ${{ github.base_ref || github.ref_name }}

  # Single required status check.
  # Its name is the ruleset-bound context, so do not rename it without updating the ruleset in lockstep.
  # It treats a skipped smoke build, meaning an unchanged target, as a pass, and blocks on failure or cancelled (D1.5, D7.4).
  check-workflow-status:
    name: Check pull request workflow status job
    runs-on: ubuntu-latest
    needs: [changes, validate, smoke-build]
    if: always()
    steps:
      - name: Check workflow results step
        run: |
          set -Eeuo pipefail
          for result in "changes:${{ needs.changes.result }}" "validate:${{ needs.validate.result }}" "smoke-build:${{ needs.smoke-build.result }}"; do
            name="${result%%:*}"
            value="${result#*:}"
            if [[ "$value" != "success" && "$value" != "skipped" ]]; then
              echo "::error::Job '$name' did not succeed ($value)."
              exit 1
            fi
          done
